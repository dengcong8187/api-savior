plugins {
    id("java")
    id("org.jetbrains.intellij.platform") version "2.10.5"
}

group = "cn.gudqs7.idea.plugins"
version = "2.6.3"

repositories {
    maven { url = uri("https://maven.aliyun.com/repository/public") }

    mavenCentral()

    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    // 插件依赖
    intellijPlatform.intellijIdea("2025.1.7")
    intellijPlatform.bundledPlugin('com.intellij.java')

    implementation("org.freemarker:freemarker:2.3.31")
    implementation("com.youbenzi:MDTool:1.2.4")
    implementation("commons-collections:commons-collections:3.2.2")
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
}

intellijPlatform {
    buildSearchableOptions = false

    pluginConfiguration {
        ideaVersion {
            sinceBuild = '251'
        }
    }
}

patchPluginXml {
    pluginDescription = file(descriptionFile).text
    changeNotes = file(changesFile).text
}
test {
    useJUnitPlatform()
}

publishPlugin {
    channels = ['default'] // 或留空，或设为 ['default']
    token = System.getenv("JET_PUB_TOKEN")
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
